<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>weekly schedule</h2>
    <table border="1">
        <tr>
            <th rowspan="2">day</th>
            <th colspan="2">schedule</th>
        </tr>
        <tr>
            <th>morning</th>
            <th>evening</th>
        </tr>
        <tr>
            <td>monday</td>
            <td>math</td>
            <td>science</td>
        </tr>
        <tr>
            <td>tuesday</td>
            <td colspan="2">field trip</td>
        </tr>
    </table>
</body>
</html>
