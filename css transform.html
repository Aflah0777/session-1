<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            margin: 5%;
            background-color: blue;
            transform: translate(100px,50px);
            transform: rotate(30deg);
            transform: scale(2,4);
            transform: scaleX(5);
            transform: scaleY(5);
            transform: skewX(50deg);
            transform: skewY(50deg);
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
