<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   
</style>
</head>
<body>
    <form method="post" onsubmit="return validate()">
    <input type="text" id="name_id" placeholder="Enter name" onkeyup="clearmsg('sp1')">
    <span id="sp1" style="color: red;"></span><br>

    <input type="text" id="mobile_id" placeholder="Enter mobile" pattern="[0-9]{10}" onkeyup="clearmsg('sp2')>
    <span id="sp2" style="color: red;"></span><br>


    <input type="text" id="adress_id" placeholder="enter adress onkeyup="clearmsg('sp3')">
    <span id="sp3" style="color: red;"></span><br>

    <input type="password" id="password_id" placeholder="Enter password" onkeyup="clearmsg('sp4')>
    <span id="sp4" style="color: red;"></span><br>


   <button type="submit">submit</button>
    </form>
    <script>
        function validate()
        {
            let name = document.getElementById("name_id").value.trim();
            let mobile = document.getElementById("mobile_id").value.trim();
            let adress = document.getElementById("adress_id").value.trim();
            let password = document.getElementById("password_id").value.trim();

            let valid = true;

            if(name === ""){
                document.getElementById("sp1").innerHTML="enter name*";
                valid = false;
            }
            if(mobile === ""){
                document.getElementById("sp2").innerHTML="enter mobile*";
                valid = false;
            }
            if(adress === ""){
                document.getElementById("sp3").innerHTML="enter adress*";
                valid = false;
            }
            if(password === ""){
                document.getElementById("sp4").innerHTML="enter password*";
                valid = false;
            }
            return valid;
        }
        function clearmsg(id){
            document.getElementById(id).innerHTML="";
        }
    </script>
</body>
</html>
