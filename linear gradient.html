<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 100%;
            background-image: linear-gradient(to right,red,blue);
            background-image: linear-gradient(to top,blue,red);
            background-image: linear-gradient(to right,red,orange,yellow,green,blue,indigo,darkblue);
            background-image: repeating-linear-gradient(to right,yellow,orange,red 200px);
            background-image: radial-gradient(lightskyblue 0 200px,orange 200px 350px,blue 350px 450px);
            background-image: conic-gradient(red 45deg,orange 90deg,green 210deg);
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
