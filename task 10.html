<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tb{
            width: 500px;
        }
        .tb td{
            background-color: aqua;
        }
        .color{
            text-align: center;
            color: brown;
        }
    </style>
</head>
<body>
<form action="" class="sib">
    <table class="tb">
        <tr class="color">
            <td colspan="2" style="background-color: lightsalmon;">Registration Form</td>
        </tr>
        <tr>
            <td>Enter name</td>
            <td><input type="text" placeholder="Enter name"></td>
        </tr>
        <tr>
            <td>Enter password</td>
            <td><input type="password" placeholder="Enter password"></td>
        </tr>
        <tr>
            <td>Enter address</td>
            <td><input type="adress" placeholder="Enter address"></td>
        </tr>
        <tr>
            <td>Select game</td>
            <td>
                <input type="checkbox" name="game">hockey<br>
                <input type="checkbox" name="game">football<br>
                <input type="checkbox" name="game">badminton<br>
                <input type="checkbox" name="game">cricket<br>
                <input type="checkbox" name="game">volleyball
            </td>
        </tr>
        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender">male
                <input type="radio" name="gender">female
            </td>
        </tr>
        <tr>
            <td>Select ur age</td>
            <td>
                <select>
                    <option value="">Select</option>
                    <option value="">18-25</option>
                    <option value="">26-35</option>
                    <option value="">36-45</option>
                    <option value="">46 above</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Select photo</td>
            <td><input type="file"></td>
        </tr>
        <tr class="sun">
            <td colspan="1"></td>
            <td>
                <button type="button">Click me</button>
                <button type="reset">Reset</button>
                <input type="submit" value="Submit form">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
</body>
</html>
